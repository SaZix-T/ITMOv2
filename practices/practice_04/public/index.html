<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>TaskFlow</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>TaskFlow</h1>
      <input type="text" id="search" placeholder="Search tasks..." autocomplete="off">
    </header>
    <main>
      <form id="task-form">
        <input type="text" id="task-title" placeholder="What needs to be done?" required autofocus>
        <input type="text" id="task-desc" placeholder="Description (optional)">
        <input type="date" id="task-due" placeholder="Due date">
        <button type="submit">Add Task</button>
      </form>
      <div id="task-list">
        <p id="loading">Loading...</p>
      </div>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
